name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Environment diagnostics
        run: |
          python -c "
          import sqlite3, sys
          row = sqlite3.connect(':memory:').execute(
              \"select 1 from pragma_compile_options where compile_options like 'ENABLE_FTS5'\"
          ).fetchone()
          print(f'::notice::FTS5 available: {bool(row)}')
          print(f'::notice::Python: {sys.version}')
          print(f'::notice::SQLite: {sqlite3.sqlite_version}')
          "
      - name: pytest collection check
        run: |
          set +e
          pytest --collect-only -q > collect.log 2>&1
          code=$?
          cat collect.log
          if [ $code -ne 0 ]; then
            grep -E "Error|error collecting" collect.log | head -n 20 | while IFS= read -r line; do
              echo "::error::COLLECT: $line"
            done
          fi
        env:
          LLM_PROVIDER: mock
          MONITORING_ENABLED: "false"
      - name: pytest
        id: pytest
        run: |
          set +e
          pytest -q --tb=short --junitxml=pytest-results.xml > pytest_output.log 2>&1
          code=$?
          cat pytest_output.log
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|Error:|Exception:" pytest_output.log | head -n 20 | while IFS= read -r line; do
              echo "::error::RUN: $line"
            done
          fi
          exit $code
        env:
          LLM_PROVIDER: mock
          MONITORING_ENABLED: "false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  build:
    name: build (docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: incidentai-app:ci
      - name: Build mock-monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mock_monitoring/Dockerfile
          push: false
          tags: incidentai-mock-monitoring:ci
